version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:4000/api
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    networks:
      - app-network
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=mysql
      - DB_USER=pokemon
      - DB_PASSWORD=pokemon123
      - PORT=4000
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=pokedex
      - MYSQL_USER=pokemon
      - MYSQL_PASSWORD=pokemon123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
